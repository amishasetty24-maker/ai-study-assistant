<!DOCTYPE html>
<html>
<head>
    <title>AI Study Assistant</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            width: 420px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            text-align: center;
            color: white;
        }

        h2 {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
            outline: none;
        }

        input[type="file"] {
            margin-bottom: 15px;
            color: white;
        }

        button {
            background: #ff7a18;
            background: linear-gradient(to right, #ff7a18, #ffb347);
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #output {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            min-height: 40px;
        }

        hr {
            border: 0.5px solid rgba(255,255,255,0.3);
            margin: 20px 0;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>✨ AI Study Assistant</h2>

    <textarea id="inputText" placeholder="Paste your notes here..."></textarea>

    <button onclick="summarizeText()">Summarize Text</button>

    <hr>

    <input type="file" id="pdfFile">

    <button onclick="uploadPDF()">Upload File</button>

    <div id="output"></div>
</div>

<script src="script.js"></script>

</body>
</html>
