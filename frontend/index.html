<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="app">

    <div class="hero">
        <h1>🚀 AI Study Assistant</h1>
        <p>
            Transform your notes into concise summaries, key points, and keywords using Gemini AI.
        </p>
    </div>

    <div class="glass-card">

        <label>📖 Study Notes</label>

        <textarea
            id="inputText"
            placeholder="Paste your notes, lecture content, or study material here..."
        ></textarea>

        <div class="actions">
            <button onclick="summarizeText()">✨ Generate Summary</button>
            <button onclick="copySummary()">📋 Copy Result</button>
        </div>

        <div class="upload-area">
            <input type="file" id="pdfFile">
            <button onclick="uploadPDF()">📄 Upload PDF</button>
        </div>

    </div>

    <div class="result-card">

        <div class="result-header">
            <h2>✨ AI Generated Output</h2>
        </div>

        <div id="result">
            Your AI-generated summary will appear here...
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
